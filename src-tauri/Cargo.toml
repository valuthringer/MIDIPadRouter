[package]
name = "midipadrouter"
version = "0.1.0"
description = "Route one Novation Launchpad Mini MK1 to several applications"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Each dependency is justified in DECISIONS.md.
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
midir = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
